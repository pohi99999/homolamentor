<title>Homlamentor Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Single deliberate visual world (premium advisory dossier) — dark ground is
     the brand, not a mode; painted explicitly so it holds on either host theme. */
  :root{
    --ink:#0b0c10;
    --surface:#14151d;
    --surface-2:#1b1d28;
    --surface-3:#22242f;
    --hairline:rgba(201,160,90,.16);
    --hairline-strong:rgba(201,160,90,.34);
    --gold:#c9a05a;
    --gold-soft:#e3c384;
    --gold-deep:#8a6a35;
    --teal:#4f9c94;
    --teal-soft:#8fc9c2;
    --text:#ece7dd;
    --text-muted:#a89f8f;
    --text-faint:#726a5c;
    --shadow:0 24px 70px rgba(0,0,0,.5);
    --radius-sm:4px;
    --radius-md:9px;
    --radius-lg:16px;
    --content-w:860px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} }

  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    font-size:16px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3,h4{
    font-family:'Fraunces', Georgia, 'Times New Roman', serif;
    font-weight:600;
    color:var(--text);
    margin:0;
    text-wrap:balance;
  }

  p{margin:0;}
  a{color:inherit;}
  ::selection{background:var(--gold-deep);color:var(--ink);}

  .mono{
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    font-variant-numeric:tabular-nums;
  }

  .eyebrow{
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    font-size:.72rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--gold-soft);
  }

  .visually-hidden{
    position:absolute; width:1px; height:1px; overflow:hidden;
    clip:rect(0 0 0 0); white-space:nowrap;
  }

  :focus-visible{
    outline:2px solid var(--gold-soft);
    outline-offset:3px;
    border-radius:2px;
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; justify-content:space-between;
    gap:1rem;
    padding:.85rem clamp(1.1rem,4vw,2.4rem);
    background:rgba(11,12,16,.88);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--hairline);
  }
  .toolbar-brand{
    display:flex; align-items:baseline; gap:.5rem;
    font-family:'Fraunces', serif; font-weight:600; font-size:1rem;
    letter-spacing:.01em;
    white-space:nowrap;
  }
  .toolbar-brand small{
    font-family:'IBM Plex Mono', monospace;
    font-weight:500; font-size:.68rem; color:var(--text-faint);
    letter-spacing:.08em; text-transform:uppercase;
  }
  .toolbar-controls{display:flex; align-items:center; gap:.65rem;}
  .lang-switch{
    display:flex; border:1px solid var(--hairline-strong);
    border-radius:999px; padding:3px; gap:2px;
    background:var(--surface);
  }
  .lang-btn{
    appearance:none; border:none; cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
    font-size:.72rem; font-weight:600; letter-spacing:.05em;
    padding:.4rem .75rem; border-radius:999px;
    background:transparent; color:var(--text-muted);
    transition:background .18s ease, color .18s ease;
  }
  .lang-btn.is-active{background:var(--gold); color:var(--ink);}
  .lang-btn:not(.is-active):hover{color:var(--text);}

  .print-btn{
    appearance:none; cursor:pointer;
    display:flex; align-items:center; gap:.45rem;
    border:1px solid var(--hairline-strong);
    background:var(--surface);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:.8rem; font-weight:600;
    padding:.5rem .9rem; border-radius:999px;
    transition:border-color .18s ease, background .18s ease;
  }
  .print-btn:hover{border-color:var(--gold-soft); background:var(--surface-2);}
  .print-btn svg{width:15px; height:15px; flex:none;}

  /* ---------- Layout helpers ---------- */
  .wrap{
    max-width:var(--content-w);
    margin:0 auto;
    padding:0 clamp(1.1rem,4vw,2.4rem);
  }
  .wrap-wide{
    max-width:1080px;
    margin:0 auto;
    padding:0 clamp(1.1rem,4vw,2.4rem);
  }

  /* ---------- Cover / hero ---------- */
  .cover{
    position:relative;
    padding:clamp(3rem,9vw,6.5rem) 0 clamp(2.5rem,6vw,4rem);
    background:
      radial-gradient(ellipse 900px 480px at 50% -10%, rgba(201,160,90,.14), transparent 60%),
      var(--ink);
    border-bottom:1px solid var(--hairline);
    overflow:hidden;
  }
  .cover::before{
    content:"";
    position:absolute; inset:0 0 auto 0; height:3px;
    background:linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold-soft) 50%, var(--gold) 80%, transparent);
    opacity:.85;
  }
  .cover-inner{position:relative; z-index:1;}
  .cover .eyebrow{display:block; margin-bottom:1.1rem;}
  .cover h1{
    font-size:clamp(2.35rem, 5.4vw, 4.1rem);
    line-height:1.05;
    letter-spacing:-.01em;
    background:linear-gradient(135deg, #f4ecd8 0%, var(--gold-soft) 45%, var(--gold-deep) 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .cover .subhead{
    margin-top:.9rem;
    font-size:clamp(1.02rem,2vw,1.2rem);
    color:var(--text-muted);
    max-width:42ch;
    font-weight:400;
  }
  .cover .intro{
    margin-top:2.1rem;
    display:flex; flex-direction:column; gap:1.05rem;
    max-width:64ch;
    font-size:1.02rem;
    color:#d8d2c4;
  }
  .cover .intro strong{color:var(--gold-soft); font-weight:600;}
  .cover-actions{
    margin-top:2.2rem;
    display:flex; flex-wrap:wrap; gap:.9rem; align-items:center;
  }
  .btn{
    display:inline-flex; align-items:center; gap:.5rem;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600; font-size:.88rem;
    padding:.75rem 1.4rem; border-radius:999px;
    text-decoration:none; cursor:pointer; border:1px solid transparent;
    transition:transform .16s ease, border-color .16s ease, background .16s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:var(--gold); color:var(--ink);}
  .btn-primary:hover{background:var(--gold-soft);}
  .btn-ghost{border-color:var(--hairline-strong); color:var(--text);}
  .btn-ghost:hover{border-color:var(--gold-soft); color:var(--gold-soft);}
  .cover-locations{
    margin-top:2.6rem;
    font-family:'IBM Plex Mono', monospace;
    font-size:.78rem; letter-spacing:.04em;
    color:var(--text-faint);
  }

  /* ---------- Stats band ---------- */
  .stats{
    border-bottom:1px solid var(--hairline);
    background:var(--surface);
  }
  .stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:0;
  }
  .stat-tile{
    padding:1.9rem 1.4rem;
    border-right:1px solid var(--hairline);
    text-align:left;
  }
  .stat-tile:last-child{border-right:none;}
  .stat-tile .value{
    font-family:'Fraunces', serif; font-weight:600; font-style:italic;
    font-size:clamp(1.7rem,3vw,2.3rem);
    color:var(--gold-soft);
    display:block; line-height:1;
  }
  .stat-tile .label{
    margin-top:.55rem; font-size:.82rem; color:var(--text-muted);
    line-height:1.4;
  }

  @media (max-width:760px){
    .stats-grid{grid-template-columns:repeat(2,1fr);}
    .stat-tile:nth-child(2){border-right:none;}
  }

  /* ---------- Sections ---------- */
  .section{padding:clamp(3rem,7vw,4.6rem) 0;}
  .section + .section{border-top:1px solid var(--hairline);}
  .section-head{max-width:64ch; margin-bottom:2.6rem;}
  .section-head .eyebrow{display:block; margin-bottom:.85rem;}
  .section-head h2{font-size:clamp(1.7rem,3.4vw,2.35rem); line-height:1.12;}
  .section-head .section-intro{
    margin-top:1rem; color:var(--text-muted); font-size:1rem; max-width:66ch;
  }
  .section--africa{background:linear-gradient(180deg, rgba(79,156,148,.05), transparent 30%);}
  .section--africa .eyebrow{color:var(--teal-soft);}

  /* ---------- Asset cards (Section I) ---------- */
  .asset-list{display:flex; flex-direction:column; gap:1.3rem;}
  .asset-card{
    position:relative;
    border:1px solid var(--hairline);
    background:var(--surface);
    border-radius:var(--radius-lg);
    padding:1.7rem 1.8rem 1.8rem;
    overflow:hidden;
  }
  .asset-num{
    position:absolute; top:.4rem; right:1.3rem;
    font-family:'Fraunces', serif; font-style:italic; font-weight:500;
    font-size:3.4rem; line-height:1;
    color:var(--gold); opacity:.11;
    pointer-events:none; user-select:none;
  }
  .asset-top{
    display:flex; flex-wrap:wrap; justify-content:space-between;
    gap:1rem 1.5rem; align-items:flex-start; position:relative; z-index:1;
  }
  .asset-tag{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:.68rem; font-weight:600; letter-spacing:.07em; text-transform:uppercase;
    color:var(--gold-soft);
    background:rgba(201,160,90,.1);
    border:1px solid rgba(201,160,90,.28);
    padding:.28rem .6rem; border-radius:var(--radius-sm);
    margin-bottom:.65rem;
  }
  .asset-title{font-size:1.28rem; line-height:1.2; max-width:34ch;}
  .asset-price{text-align:right; flex:none;}
  .asset-price .plabel{
    display:block; font-family:'IBM Plex Mono',monospace;
    font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint);
  }
  .asset-price .pvalue{
    display:block; margin-top:.2rem;
    font-family:'Fraunces', serif; font-weight:600; font-size:1.18rem; color:var(--gold-soft);
  }
  .asset-loc{
    margin-top:.9rem;
    display:inline-flex; align-items:center; gap:.4rem;
    font-size:.82rem; color:var(--teal-soft);
    background:rgba(79,156,148,.08);
    border:1px solid rgba(79,156,148,.22);
    padding:.3rem .65rem; border-radius:var(--radius-sm);
  }
  .asset-loc svg{width:12px; height:12px; flex:none;}
  .asset-desc{
    margin-top:1rem; font-size:.93rem; color:#cfc9bb; max-width:68ch; line-height:1.6;
  }
  .asset-features{
    margin-top:1.1rem;
    display:flex; flex-wrap:wrap; gap:.5rem;
  }
  .asset-features li{
    list-style:none;
    font-size:.78rem; color:var(--text-muted);
    background:var(--surface-2);
    border:1px solid var(--hairline);
    padding:.4rem .7rem; border-radius:var(--radius-sm);
  }

  /* ---------- Pillars (Section II) ---------- */
  .pillar-grid{display:flex; flex-direction:column; gap:1rem;}
  .pillar-card{
    display:flex; gap:1.1rem;
    border:1px solid var(--hairline);
    background:var(--surface);
    border-radius:var(--radius-lg);
    padding:1.3rem 1.5rem;
  }
  .pillar-num{
    flex:none; width:2.5rem; height:2.5rem;
    border-radius:var(--radius-sm);
    background:rgba(79,156,148,.12);
    border:1px solid rgba(79,156,148,.32);
    color:var(--teal-soft);
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:.85rem;
    display:flex; align-items:center; justify-content:center;
  }
  .pillar-card h3{font-size:1.05rem; margin-bottom:.4rem;}
  .pillar-card p{font-size:.9rem; color:var(--text-muted);}

  /* ---------- Solar table ---------- */
  .table-wrap{
    margin-top:1.6rem;
    border:1px solid var(--hairline);
    border-radius:var(--radius-lg);
    overflow:auto;
    background:var(--surface);
  }
  table{border-collapse:collapse; width:100%; min-width:560px;}
  thead th{
    text-align:left;
    font-family:'IBM Plex Mono',monospace;
    font-size:.68rem; letter-spacing:.07em; text-transform:uppercase;
    color:var(--teal-soft);
    padding:.85rem 1rem;
    border-bottom:1px solid var(--hairline-strong);
    white-space:nowrap;
  }
  tbody td{
    padding:.75rem 1rem;
    font-size:.87rem;
    border-bottom:1px solid var(--hairline);
    color:var(--text-muted);
    white-space:nowrap;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:nth-child(odd){background:rgba(255,255,255,.012);}
  td.num, th.num{text-align:right;}
  td.cost{color:var(--gold-soft); font-weight:600;}
  td.loc{color:var(--text); font-family:'IBM Plex Sans',sans-serif;}

  .grid-note{
    margin-top:1.4rem; font-size:.88rem; color:var(--text-muted);
    max-width:70ch; line-height:1.65;
  }

  /* ---------- EPC opportunities ---------- */
  .epc-list{margin-top:1.6rem; display:flex; flex-direction:column; gap:.7rem;}
  .epc-item{
    border:1px solid var(--hairline);
    border-left:2px solid var(--teal);
    background:var(--surface);
    border-radius:var(--radius-sm);
    padding:.9rem 1.1rem;
  }
  .epc-item .name{
    display:block; font-family:'Fraunces',serif; font-weight:600;
    color:var(--teal-soft); font-size:1rem; margin-bottom:.3rem;
  }
  .epc-item .detail{font-size:.87rem; color:var(--text-muted); line-height:1.6;}

  .ecowas-panel{
    margin-top:2rem;
    border:1px solid rgba(79,156,148,.32);
    background:linear-gradient(135deg, rgba(79,156,148,.09), rgba(79,156,148,.02));
    border-radius:var(--radius-lg);
    padding:1.5rem 1.7rem;
  }
  .ecowas-panel h4{font-size:1rem; color:var(--teal-soft); margin-bottom:.85rem;}
  .ecowas-panel ul{margin:0; padding:0; display:flex; flex-direction:column; gap:.55rem;}
  .ecowas-panel li{
    list-style:none; font-size:.88rem; color:#cfc9bb;
    padding-left:1.1rem; position:relative; line-height:1.55;
  }
  .ecowas-panel li::before{
    content:"—"; position:absolute; left:0; color:var(--teal-soft);
  }

  /* ---------- Modular housing stats ---------- */
  .mod-stats{
    margin-top:2.2rem;
    display:grid; grid-template-columns:repeat(3,1fr); gap:1rem;
  }
  .mod-tile{
    border:1px solid var(--hairline); background:var(--surface);
    border-radius:var(--radius-lg); padding:1.4rem;
  }
  .mod-tile .value{
    font-family:'Fraunces',serif; font-weight:600; font-style:italic;
    font-size:1.8rem; color:var(--gold-soft); display:block;
  }
  .mod-tile .title{font-size:.88rem; font-weight:600; margin-top:.5rem;}
  .mod-tile .desc{font-size:.82rem; color:var(--text-muted); margin-top:.4rem; line-height:1.5;}

  .adv-block{
    margin-top:2rem; border:1px solid var(--hairline); background:var(--surface);
    border-radius:var(--radius-lg); padding:1.6rem 1.8rem;
  }
  .adv-block h3{font-size:1.05rem; color:var(--gold-soft); margin-bottom:.6rem;}
  .adv-block > p{font-size:.9rem; color:var(--text-muted); margin-bottom:1.1rem; max-width:68ch;}
  .adv-items{display:flex; flex-direction:column; gap:.65rem;}
  .adv-item{
    background:var(--surface-2); border:1px solid var(--hairline);
    border-radius:var(--radius-sm); padding:.85rem 1rem;
  }
  .adv-item .t{display:block; font-weight:600; color:var(--gold-soft); font-size:.88rem; margin-bottom:.2rem;}
  .adv-item .d{font-size:.85rem; color:var(--text-muted);}

  @media (max-width:700px){
    .mod-stats{grid-template-columns:1fr;}
  }

  /* ---------- Contact ---------- */
  .contact-card{
    max-width:520px; margin:0 auto;
    text-align:center;
    border:1px solid var(--hairline-strong);
    background:radial-gradient(ellipse at 50% 0%, rgba(201,160,90,.09), var(--surface) 60%);
    border-radius:var(--radius-lg);
    padding:2.4rem 2rem;
  }
  .contact-badge{
    width:60px; height:60px; border-radius:50%;
    background:rgba(201,160,90,.14); border:1px solid rgba(201,160,90,.4);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 1rem;
    font-family:'Fraunces',serif; font-weight:600; font-size:1.3rem; color:var(--gold-soft);
  }
  .contact-card h3{font-size:1.5rem;}
  .contact-role{
    margin-top:.35rem; font-family:'IBM Plex Mono',monospace;
    font-size:.72rem; letter-spacing:.09em; text-transform:uppercase; color:var(--gold-soft);
  }
  .contact-links{margin-top:1.5rem; display:flex; flex-direction:column; gap:.7rem; align-items:center;}
  .contact-link{
    display:inline-flex; align-items:center; gap:.55rem;
    font-size:.94rem; color:var(--text); text-decoration:none;
  }
  .contact-link svg{width:16px; height:16px; color:var(--gold-soft); flex:none;}
  .contact-link:hover{color:var(--gold-soft);}

  .closing-panel{
    max-width:640px; margin:2.6rem auto 0; text-align:center;
  }
  .closing-panel h3{font-size:1.2rem;}
  .closing-panel p{margin-top:.8rem; font-size:.94rem; color:var(--text-muted); line-height:1.65;}
  .closing-panel .btn{margin-top:1.3rem;}

  .disclaimer{
    max-width:680px; margin:2.6rem auto 0;
    font-size:.78rem; color:var(--text-faint); line-height:1.6; text-align:center;
  }

  .site-footer{
    border-top:1px solid var(--hairline);
    padding:1.8rem clamp(1.1rem,4vw,2.4rem);
    text-align:center;
    font-size:.78rem; color:var(--text-faint);
  }

  /* ---------- Reveal-on-load (guarded so base state is always visible) ---------- */
  @media (prefers-reduced-motion: no-preference){
    .reveal{animation:fadeUp .75s cubic-bezier(.22,.61,.36,1) both;}
    .reveal-delay-1{animation-delay:.08s;}
    .reveal-delay-2{animation-delay:.16s;}
    @keyframes fadeUp{
      from{opacity:0; transform:translateY(14px);}
      to{opacity:1; transform:translateY(0);}
    }
  }

  /* ---------- Print ---------- */
  @media print{
    @page{margin:14mm;}
    html,body{background:#0b0c10 !important;}
    *{-webkit-print-color-adjust:exact !important; print-color-adjust:exact !important;}
    .toolbar{display:none !important;}
    .cover{padding-top:0;}
    .page-one{break-after:page;}
    .section{break-before:page; padding-top:0;}
    .asset-card, .pillar-card, .epc-item, .mod-tile, .stat-tile, tr{break-inside:avoid;}
    a[href]{color:inherit; text-decoration:none;}
    .btn{border:1px solid var(--hairline-strong);}
  }
</style>

<div class="toolbar">
  <div class="toolbar-brand">HOMLAMENTOR <small id="brandSuffix">· Portfólió</small></div>
  <div class="toolbar-controls">
    <div class="lang-switch" role="group" aria-label="Nyelv / Language">
      <button class="lang-btn is-active" id="btnHu" data-lang="hu" aria-pressed="true">HU</button>
      <button class="lang-btn" id="btnEn" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <button class="print-btn" id="printBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      <span id="printLabel">PDF mentése</span>
    </button>
  </div>
</div>

<main id="app"></main>

<script>
(function(){
  var D = {
    hu: {
      htmlLang:'hu',
      brandSuffix:'· Portfólió',
      printLabel:'PDF mentése',
      hero:{
        kicker:'HOMLAMENTOR KFT — TANÁCSADÓI PORTFÓLIÓ · 2026',
        h1:'Portfólió &amp; Globális Kapcsolatrendszer',
        subhead:'Ingatlanbefektetés, üzleti letelepedés és stratégiai partnerkapcsolatok Európában és Nyugat-Afrikában.',
        intro:[
          'A <strong>HOMLAMENTOR KFT</strong> nem egy zárt ingatlanlista, hanem egy élő kapcsolatrendszer. Kiterjedt nemzetközi hálózatunk és folyamatosan bővülő adatbázisunk révén gyakorlatilag <strong>bármilyen ingatlanbefektetési igényt, üzleti letelepedést vagy stratégiai partnerkapcsolatot</strong> össze tudunk hozni — bármely országban, bármely szektorban, amennyiben a másik fél nyitott az egyeztetésre.',
          'Csapatunk Budapesttől Abidjanig épít és tart fenn közvetlen, ellenőrzött kapcsolatokat tulajdonosokkal, fejlesztőkkel, állami szereplőkkel és intézményi befektetőkkel egyaránt. Az alábbi válogatás jelenlegi, aktív off-market lehetőségeinket mutatja be — ha az Ön igénye nem szerepel köztük, keressen minket: hálózatunk minden bizonnyal talál rá megoldást.'
        ],
